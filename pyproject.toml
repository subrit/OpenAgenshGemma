[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agensh-gemma"
version = "2.0.0"
description = "Scalable Decentralized Multi-Agent Harness (4 to 1,024 Agents) Powered by Gemma 4, E2B Sandboxes, and SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Agensh Open Source Contributors" }
]
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.40.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "e2b-code-interpreter>=2.11.0",
    "e2b>=2.50.0",
]

[project.scripts]
agensh = "launch_agensh:main"
